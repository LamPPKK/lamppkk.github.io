about:
  en:
  - I am a Technical Project Manager who connects engineering decisions with business operations. My background spans mobile development, cybersecurity assessment, SaaS operations, and technical education.
  - At FPT Software and across concurrent engagements, I coordinate cross-functional teams, clarify scope, surface delivery risk, and turn complex work into transparent plans. More than five years of hands-on mobile engineering help me challenge estimates and support architecture decisions without losing sight of the customer outcome.
  vi:
  - Tôi là Quản lý Dự án Kỹ thuật, kết nối quyết định kỹ thuật với vận hành kinh doanh. Nền tảng của tôi trải rộng từ phát triển mobile, đánh giá an ninh mạng, vận hành SaaS đến đào tạo kỹ thuật.
  - Tại FPT Software và các công việc đồng thời, tôi phối hợp nhóm đa chức năng, làm rõ phạm vi, nhận diện rủi ro và chuyển công việc phức tạp thành kế hoạch minh bạch. Hơn năm năm trực tiếp phát triển mobile giúp tôi phản biện ước lượng và hỗ trợ quyết định kiến trúc mà vẫn bám sát kết quả khách hàng.
  ja:
  - 私は、エンジニアリング上の判断と事業運用をつなぐテクニカルプロジェクトマネージャーです。モバイル開発、サイバーセキュリティ評価、SaaS運用、技術教育の経験があります。
  - FPT Softwareおよび並行案件で、部門横断チームを調整し、スコープを明確化し、リスクを早期に示し、複雑な業務を透明な計画へ落とし込みます。5年以上のモバイル開発経験を生かし、顧客成果を見失わずに見積もりと設計判断を支援します。
  zh:
  - 我是一名技术项目经理，致力于连接工程决策与业务运营。我的经验涵盖移动开发、网络安全评估、SaaS运营和技术教育。
  - 在FPT Software及并行项目中，我协调跨职能团队、明确范围、提前暴露交付风险，并将复杂工作转化为透明计划。五年以上的一线移动开发经验，使我能够审视估算和架构决策，同时始终聚焦客户成果。
